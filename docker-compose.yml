services:
  sentinel:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      MT_SESSION_FILE: /app/.secrets/mtproto.session
    volumes:
      - sentinel_data:/app/data
      - ./.secrets:/app/.secrets:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-18765}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sentinel_data:
